<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0f10;
    color: #f5f5f5;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   MAIN
========================= */

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 0 18px 60px;
}

/* =========================
   HEADER
========================= */

header {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom: 1px solid #25292a;
}

.username {
    font-size: 22px;
    font-weight: 500;
}

.instagram-link {
    color: #ddd;
    text-decoration: none;
    font-size: 14px;
}

.instagram-link:hover {
    color: white;
}

/* =========================
   PROFILE
========================= */

.profile {
    display: grid;
    grid-template-columns: 180px 1fr;

    gap: 40px;

    padding: 42px 35px 35px;

    align-items: center;
}

.profile-picture {
    width: 150px;
    height: 150px;

    border-radius: 50%;

    object-fit: cover;

    background: #333;
}

.profile-info h1 {
    margin: 0 0 20px;

    font-size: 21px;
    font-weight: 500;
}

.stats {
    display: flex;
    gap: 35px;

    margin-bottom: 20px;

    font-size: 14px;
    color: #aaa;
}

.stats strong {
    color: white;
}

.real-name {
    font-size: 14px;
    font-weight: 600;

    margin-bottom: 8px;
}

.bio {
    font-size: 13px;
    color: #ccc;
}

/* =========================
   TABS
========================= */

.tabs {
    height: 58px;

    border-top: 1px solid #25292a;
    border-bottom: 1px solid #25292a;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 100px;
}

.tab {
    width: 25px;
    height: 25px;

    color: #777;

    display: flex;
    align-items: center;
    justify-content: center;
}

.tab.active {
    color: white;
}

/* =========================
   GRID
========================= */

.grid {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 3px;

    margin-top: 3px;
}

.post {
    position: relative;

    aspect-ratio: 1 / 1;

    overflow: hidden;

    background: #15191a;
}

.post img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;

    transition: transform 0.4s ease;
}

.post:hover img {
    transform: scale(1.04);
}

/* =========================
   POST ICON
========================= */

.post-icon {
    position: absolute;

    top: 10px;
    right: 10px;

    width: 22px;
    height: 22px;

    color: white;

    filter: drop-shadow(0 1px 4px black);
}

/* =========================
   FOOTER
========================= */

footer {
    text-align: center;

    padding-top: 35px;

    color: #555;

    font-size: 11px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    .container {
        padding: 0 8px 40px;
    }

    header {
        height: 60px;
        padding: 0 8px;
    }

    .username {
        font-size: 19px;
    }

    .instagram-link {
        font-size: 12px;
    }

    .profile {
        grid-template-columns: 90px 1fr;

        gap: 20px;

        padding: 28px 12px;
    }

    .profile-picture {
        width: 85px;
        height: 85px;
    }

    .profile-info h1 {
        font-size: 18px;
        margin-bottom: 12px;
    }

    .stats {
        gap: 15px;
        font-size: 11px;
        margin-bottom: 12px;
    }

    .real-name {
        font-size: 12px;
    }

    .bio {
        font-size: 11px;
    }

    .tabs {
        gap: 60px;
    }

}

</style>
</head>
