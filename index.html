<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Svajūnas Širmelis</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content {
      text-align: center;
    }

    h1 {
      font-size: clamp(32px, 5vw, 64px);
      font-weight: 400;
      letter-spacing: -1.5px;
    }

    a {
      display: inline-block;
      margin-top: 14px;
      font-size: 12px;
      letter-spacing: 1px;
      color: #777;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    a:hover {
      color: #fff;
    }
  </style>
</head>

<body>

  <div class="content">
    <h1>Svajūnas Širmelis</h1>

    <a
      href="https://www.instagram.com/svajis/"
      target="_blank"
      rel="noopener noreferrer"
    >
      @svajis
    </a>
  </div>

</body>
</html>
