<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>@svajis</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      width: 100%;
      padding: 25px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 500;
    }

    header a {
      color: #111;
      text-decoration: none;
      font-size: 14px;
    }

    header a:hover {
      opacity: .5;
    }

    .feed {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    /* Instagram profile embed */
    .instagram-profile {
      width: 100%;
      max-width: 1000px;
    }

    footer {
      text-align: center;
      padding: 40px;
      color: #999;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <header>
    <h1>@svajis</h1>

    <a
      href="https://www.instagram.com/svajis/"
      target="_blank"
      rel="noopener noreferrer">
      Instagram ↗
    </a>
  </header>

  <main class="feed">

    <div class="instagram-profile">

      <blockquote
        class="instagram-media"
        data-instgrm-permalink="https://www.instagram.com/svajis/"
        data-instgrm-version="14"
        style="
          background:#fff;
          border:0;
          border-radius:0;
          margin:0 auto;
          max-width:1000px;
          min-width:326px;
          width:100%;
        ">
      </blockquote>

    </div>

  </main>

  <footer>
    © 2026 Svajis
  </footer>

  <script async src="https://www.instagram.com/embed.js"></script>

</body>
</html>
