<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>@svajis</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0f10;
    color: #f5f5f5;
    font-family: Arial, Helvetica, sans-serif;
}

a {
    color: inherit;
    text-decoration: none;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 0 18px 60px;
}

/* HEADER */

header {
    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom: 1px solid #25292a;
}

.username {
    font-size: 22px;
    font-weight: 500;
}

.instagram-link {
    font-size: 14px;
    color: #ccc;
}

.instagram-link:hover {
    color: white;
}


/* PROFILE */

.profile {
    display: grid;

    grid-template-columns: 180px 1fr;

    gap: 40px;

    padding: 42px 35px 35px;

    align-items: center;
}

.profile-picture {
    width: 150px;
    height: 150px;

    border-radius: 50%;

    object-fit: cover;

    background: #333;
}

.profile-info h1 {
    margin: 0 0 20px;

    font-size: 21px;
    font-weight: 500;
}

.stats {
    display: flex;
    gap: 35px;

    margin-bottom: 20px;

    font-size: 14px;

    color: #aaa;
}

.stats strong {
    color: white;
}

.real-name {
    font-size: 14px;
    font-weight: 600;

    margin-bottom: 8px;
}

.bio {
    font-size: 13px;
    color: #ccc;
}


/* TABS */

.tabs {
    height: 58px;

    border-top: 1px solid #25292a;
    border-bottom: 1px solid #25292a;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 100px;
}

.tab {
    color: #777;

    width: 25px;
    height: 25px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.tab.active {
    color: white;
}


/* INSTAGRAM GRID */

.grid {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 3px;

    margin-top: 3px;
}

.post {
    position: relative;

    aspect-ratio: 1 / 1;

    overflow: hidden;

    background: #15191a;
}

.post img,
.post video {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;

    transition: transform .4s ease;
}

.post:hover img,
.post:hover video {
    transform: scale(1.04);
}


/* REEL ICON */

.reel-icon {
    position: absolute;

    right: 10px;
    top: 10px;

    width: 22px;
    height: 22px;

    color: white;

    filter: drop-shadow(0 1px 4px black);

    z-index: 2;
}


/* LOADING */

.loading {
    grid-column: 1 / -1;

    padding: 100px 20px;

    text-align: center;

    color: #666;
}


/* ERROR */

.error {
    grid-column: 1 / -1;

    padding: 100px 20px;

    text-align: center;

    color: #888;
}


/* FOOTER */

footer {
    text-align: center;

    padding-top: 35px;

    color: #555;

    font-size: 11px;
}


/* MOBILE */

@media (max-width: 650px) {

    .container {
        padding: 0 8px 40px;
    }

    header {
        height: 60px;
        padding: 0 8px;
    }

    .username {
        font-size: 19px;
    }

    .instagram-link {
        font-size: 12px;
    }

    .profile {

        grid-template-columns: 90px 1fr;

        gap: 20px;

        padding: 28px 12px;
    }

    .profile-picture {
        width: 85px;
        height: 85px;
    }

    .profile-info h1 {
        font-size: 18px;
        margin-bottom: 12px;
    }

    .stats {
        gap: 15px;
        font-size: 11px;
        margin-bottom: 12px;
    }

    .real-name {
        font-size: 12px;
    }

    .bio {
        font-size: 11px;
    }

    .tabs {
        gap: 60px;
    }

}

</style>
</head>


<body>


<div class="container">


<header>

    <a
        class="username"
        href="https://www.instagram.com/svajis/"
        target="_blank"
    >
        @svajis
    </a>

    <a
        class="instagram-link"
        href="https://www.instagram.com/svajis/"
        target="_blank"
    >
        Instagram ↗
    </a>

</header>



<section class="profile">

    <img
        id="profilePicture"
        class="profile-picture"
        src=""
        alt="Svajis"
    >

    <div class="profile-info">

        <h1 id="username">
            svajis
        </h1>

        <div class="stats">

            <span>
                <strong id="followers">—</strong>
                followers
            </span>

            <span>
                <strong id="following">—</strong>
                following
            </span>

        </div>

        <div
            id="realName"
            class="real-name"
        >
            Svajūnas Širmelis
        </div>

        <div
            id="bio"
            class="bio"
        >
            FILMMAKER & BMX RIDER
        </div>

    </div>

</section>



<div class="tabs">

    <!-- GRID -->

    <div class="tab active">

        <svg
            width="21"
            height="21"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
        >

            <rect x="4" y="4" width="6" height="6"/>
            <rect x="14" y="4" width="6" height="6"/>
            <rect x="4" y="14" width="6" height="6"/>
            <rect x="14" y="14" width="6" height="6"/>

        </svg>

    </div>


    <!-- REELS -->

    <div class="tab">

        <svg
            width="21"
            height="21"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
        >

            <rect
                x="4"
                y="4"
                width="16"
                height="16"
                rx="4"
            />

            <path d="M9 8l6 4-6 4V8z"/>

        </svg>

    </div>


    <!-- TAGGED -->

    <div class="tab">

        <svg
            width="21"
            height="21"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
        >

            <rect
                x="4"
                y="4"
                width="16"
                height="16"
                rx="4"
            />

            <circle
                cx="12"
                cy="11"
                r="3"
            />

            <path
                d="M8 20c.8-2.7 2.1-4 4-4s3.2 1.3 4 4"
            />

        </svg>

    </div>

</div>



<!-- REAL INSTAGRAM POSTS -->

<section
    id="feed"
    class="grid"
>

    <div class="loading">
        Loading Instagram…
    </div>

</section>



<footer>
    © 2026 Svajis
</footer>


</div>



<script>

async function loadInstagramFeed() {

    const feed =
        document.getElementById("feed");

    try {

        const response =
            await fetch("instagram.json?cache=" + Date.now());

        if (!response.ok) {
            throw new Error("instagram.json not found");
        }

        const data =
            await response.json();


        /* PROFILE */

        if (data.profile) {

            if (data.profile.profile_picture) {

                document
                    .getElementById("profilePicture")
                    .src =
                    data.profile.profile_picture;

            }

            if (data.profile.username) {

                document
                    .getElementById("username")
                    .textContent =
                    data.profile.username;

            }

            if (data.profile.followers !== undefined) {

                document
                    .getElementById("followers")
                    .textContent =
                    data.profile.followers.toLocaleString();

            }

            if (data.profile.following !== undefined) {

                document
                    .getElementById("following")
                    .textContent =
                    data.profile.following.toLocaleString();

            }

            if (data.profile.name) {

                document
                    .getElementById("realName")
                    .textContent =
                    data.profile.name;

            }

            if (data.profile.bio) {

                document
                    .getElementById("bio")
                    .textContent =
                    data.profile.bio;

            }

        }


        /* POSTS */

        feed.innerHTML = "";


        if (!data.posts || data.posts.length === 0) {

            feed.innerHTML = `
                <div class="error">
                    No Instagram posts found.
                </div>
            `;

            return;
        }


        data.posts.forEach(post => {

            const link =
                document.createElement("a");

            link.className = "post";

            link.href =
                post.permalink;

            link.target =
                "_blank";

            link.rel =
                "noopener noreferrer";


            let media;


            if (
                post.media_type === "VIDEO"
                &&
                post.thumbnail_url
            ) {

                media =
                    document.createElement("img");

                media.src =
                    post.thumbnail_url;

            }

            else {

                media =
                    document.createElement("img");

                media.src =
                    post.media_url;

            }


            media.loading =
                "lazy";

            media.alt =
                post.caption || "@svajis";


            link.appendChild(media);


            /* REEL / VIDEO ICON */

            if (post.media_type === "VIDEO") {

                const icon =
                    document.createElement("div");

                icon.className =
                    "reel-icon";

                icon.innerHTML = `
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <rect
                            x="4"
                            y="4"
                            width="16"
                            height="16"
                            rx="4"
                        />
                        <path d="M9 8l6 4-6 4V8z"/>
                    </svg>
                `;

                link.appendChild(icon);

            }


            feed.appendChild(link);

        });

    }


    catch (error) {

        console.error(error);

        feed.innerHTML = `
            <div class="error">
                Unable to load Instagram feed.
            </div>
        `;

    }

}


loadInstagramFeed();

</script>


</body>
</html>
